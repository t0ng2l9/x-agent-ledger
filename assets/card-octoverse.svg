<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#0B0D10"/>
  <!-- accent rule top-left -->
  <rect x="120" y="112" width="72" height="6" fill="#4ADE80"/>
  <text x="120" y="180" font-family="Segoe UI, Arial, sans-serif" font-size="24"
        letter-spacing="6" fill="#8A94A6">OCTOVERSE 2026</text>

  <!-- the four numbers -->
  <g font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#F2F4F7">
    <text x="120" y="360" font-size="150">17.9B</text>
    <text x="120" y="560" font-size="150">1.3B</text>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#8A94A6">
    <text x="124" y="410">pushes in 12 months — more than 2024 and 2025 combined</text>
    <text x="124" y="610">merged pull requests — 3.5M a day on average</text>
  </g>

  <!-- highlight stat -->
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="980" y="330" font-size="26" letter-spacing="5" fill="#8A94A6">SINCE SEPTEMBER</text>
    <text x="980" y="500" font-size="210" font-weight="700" fill="#4ADE80">40%</text>
    <text x="984" y="556" font-size="30" fill="#8A94A6">of pull requests</text>
    <text x="984" y="596" font-size="30" fill="#8A94A6">started by an agent</text>
  </g>

  <line x1="120" y1="720" x2="1480" y2="720" stroke="#FFFFFF" stroke-opacity="0.14"/>
  <text x="120" y="782" font-family="Segoe UI, Arial, sans-serif" font-size="26"
        letter-spacing="4" fill="#F2F4F7">AGENT LEDGER</text>
  <text x="1480" y="782" text-anchor="end" font-family="Segoe UI, Arial, sans-serif"
        font-size="20" letter-spacing="2" fill="#5C6577">github.blog · 2026-10-28</text>
</svg>

